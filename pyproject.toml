[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schikatron"
version = "0.1.0"
description = "Experimental normalized 2D cycling kinematics, without biomechanical interpretation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
video = ["opencv-python>=4.8,<5", "numpy>=1.24,<3"]

[project.scripts]
schikatron = "schikatron.cli:main"

[tool.setuptools.packages.find]
include = ["schikatron*"]
